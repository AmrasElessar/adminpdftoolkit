services:
  adminpdf:
    build:
      context: .
      args:
        WITH_LIBREOFFICE: "true"
    image: admin-pdf-toolkit:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # change to "8000:8000" to expose on the LAN
    environment:
      APT_MAX_UPLOAD_MB: "500"
      APT_MAX_WORKERS: "2"
      # LAN access with pairing (phones etc.):
      # APT_LAN_ENABLED: "true"
      # APT_PAIRING_KEY: "change-me"
      # APT_ALLOWED_HOSTS: "pdf.example.local"
    volumes:
      - adminpdf-data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /home/app
    security_opt:
      - no-new-privileges:true

volumes:
  adminpdf-data:
