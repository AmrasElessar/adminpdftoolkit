[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adminpdf"
version = "2.0.0"
description = "Admin PDF Toolkit v2 — offline, LAN-first PDF application"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Orhan Engin Okay" }]
dependencies = [
    "pymupdf>=1.26,<2.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pdf2docx>=0.5.8,<1.0",
    "openpyxl>=3.1,<4.0",
    "python-docx>=1.1,<2.0",
    "pikepdf>=9.0,<11.0",
    # MPL-2.0. v17+: in-process API, ``ocr_engine="none"`` and ``mode=`` are used.
    "ocrmypdf>=17.0,<18.0",
    "pyhanko>=0.25,<1.0",
    "pyhanko-certvalidator>=0.26,<1.0",
    "cryptography>=42",
    "fonttools>=4.40,<5.0",
    # Apache-2.0: document detection, perspective and skew correction.
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "Pillow>=10.0",
    # BSD-3-Clause: QR codes for pairing phones and tablets.
    "segno>=1.6,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
adminpdf = "adminpdf.__main__:main"

[tool.setuptools.packages.find]
include = ["adminpdf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Turkish text is intentional

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# PyMuPDF ships no usable type information; treat it as Any.
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
follow_untyped_imports = false

[tool.setuptools.package-data]
# Ship the bundled fonts and the built web UI inside the wheel.
adminpdf = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "web_dist/**/*"]
