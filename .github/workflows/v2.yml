name: v2

on:
  push:
    branches: [main, develop, "claude/**"]
    paths: ["v2/**", ".github/workflows/v2.yml"]
  pull_request:
    paths: ["v2/**", ".github/workflows/v2.yml"]
  workflow_dispatch:

concurrency:
  group: v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    defaults:
      run:
        working-directory: v2/server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur ghostscript qpdf libreoffice-writer-nogui
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy adminpdf
      - name: Test
        run: pytest -q

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: v2
          push: false
          tags: admin-pdf-toolkit:2-ci
          cache-from: type=gha,scope=v2
          cache-to: type=gha,mode=max,scope=v2
