name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: System tools (Linux)
        if: runner.os == 'Linux'
        # A stalled Ubuntu mirror used to hang this step for hours: bounded
        # attempts, retried, and the man-db rebuild (minutes per run) skipped.
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            if timeout 180 sudo -E apt-get $apt_opts update \
              && timeout 360 sudo -E apt-get $apt_opts install -y --no-install-recommends \
                tesseract-ocr tesseract-ocr-tur ghostscript qpdf libreoffice-writer-nogui; then
              break
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sudo dpkg --configure -a || true
            sleep 15
          done
          for tool in tesseract gs qpdf soffice; do command -v "$tool"; done
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy adminpdf
      - name: Test
        run: pytest -q

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    name: E2E accessibility (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Install server
        working-directory: server
        run: pip install .
      - name: Start server
        working-directory: server
        run: |
          APT_DATA_DIR="$RUNNER_TEMP/apt" nohup python -m adminpdf > "$RUNNER_TEMP/server.log" 2>&1 &
          # HTTPS with the server's own CA: verify against it, do not skip checks.
          for i in $(seq 1 30); do curl -sf --cacert "$RUNNER_TEMP/apt/tls/ca.crt" https://localhost:8000/api/health && break; sleep 1; done
          # Plain HTTP is not served.
          ! curl -sf -m 5 http://127.0.0.1:8000/api/health
      - name: Sample PDF
        run: |
          python - <<'PY'
          import pymupdf
          d = pymupdf.open(); p = d.new_page()
          p.insert_text((72, 100), "Ad Soyad: Test Kisi", fontsize=12)
          p.insert_text((72, 130), "Telefon 0532 123 45 67", fontsize=12)
          d.save("sample.pdf")
          PY
      - name: Audit
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          APT_URL=https://localhost:8000 npm run e2e:a11y -- ../sample.pdf
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  launcher:
    name: Windows launcher (csc, C# 5)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile AdminPDFToolkit.exe
        shell: pwsh
        run: |
          $csc = Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64\v4*\csc.exe" | Sort-Object FullName | Select-Object -Last 1
          (Get-Content scripts/launcher/AssemblyInfo.cs.in -Raw).Replace("{version}", "0.0.0") | Set-Content "$env:RUNNER_TEMP\AssemblyInfo.cs"
          # Windows paths: csc reads a forward slash as the start of an option.
          $src = (Resolve-Path scripts\launcher).Path
          & $csc.FullName /nologo /warnaserror /target:winexe "/out:$env:RUNNER_TEMP\AdminPDFToolkit.exe" `
            "/win32icon:$src\app.ico" "/win32manifest:$src\app.manifest" `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll `
            "$src\Launcher.cs" "$env:RUNNER_TEMP\AssemblyInfo.cs"
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
          (Get-Item "$env:RUNNER_TEMP\AdminPDFToolkit.exe").VersionInfo | Format-List ProductName, FileVersion

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: admin-pdf-toolkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
