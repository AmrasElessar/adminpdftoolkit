name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/pyproject.toml
      # The Ubuntu mirror is sometimes very slow (LibreOffice alone is ~100 MB):
      # keep the downloaded packages in the Actions cache, one per runner image.
      - name: Package cache key (Linux)
        id: apt-key
        if: runner.os == 'Linux'
        run: echo "key=apt-${ImageOS:-linux}-${ImageVersion:-0}-py${{ matrix.python-version }}-v1" >> "$GITHUB_OUTPUT"
      - name: Package cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: ${{ steps.apt-key.outputs.key }}
      - name: System tools (Linux)
        if: runner.os == 'Linux'
        # Bounded and retried so a stalled mirror cannot hang the job; partly
        # downloaded packages are kept, so each attempt continues the last one.
        timeout-minutes: 40
        env:
          DEBIAN_FRONTEND: noninteractive
          # LibreOffice (~100 MB) only in one job; its tests skip elsewhere,
          # as on Windows and macOS.
          WITH_LIBREOFFICE: ${{ matrix.python-version == '3.13' }}
        run: |
          sudo rm -f /var/lib/man-db/auto-update /etc/apt/apt.conf.d/docker-clean
          # The runners' default azure mirror crawled at ~100 KB/s: use Ubuntu's own.
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          packages="tesseract-ocr tesseract-ocr-tur ghostscript qpdf"
          tools="tesseract gs qpdf"
          if [ "$WITH_LIBREOFFICE" = true ]; then
            packages="$packages libreoffice-writer-nogui"
            tools="$tools soffice"
          fi
          mkdir -p ~/apt-cache
          sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60"
          apt_opts="$apt_opts -o Binary::apt::APT::Keep-Downloaded-Packages=true"
          for attempt in 1 2 3; do
            if timeout 300 sudo -E apt-get $apt_opts update \
              && timeout 900 sudo -E apt-get $apt_opts install -y --no-install-recommends $packages; then
              break
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sudo dpkg --configure -a || true
            sleep 15
          done
          for tool in $tools; do command -v "$tool"; done
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy adminpdf
      - name: Test
        # One worker per CPU: every job runs in its own process, which is slow
        # to start on the macOS runners (19 min serial).
        run: pytest -q -n auto

  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    name: E2E accessibility (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Install server
        working-directory: server
        run: pip install .
      - name: Start server
        working-directory: server
        run: |
          APT_DATA_DIR="$RUNNER_TEMP/apt" nohup python -m adminpdf > "$RUNNER_TEMP/server.log" 2>&1 &
          # HTTPS with the server's own CA: verify against it, do not skip checks.
          for i in $(seq 1 30); do curl -sf --cacert "$RUNNER_TEMP/apt/tls/ca.crt" https://localhost:8000/api/health && break; sleep 1; done
          # Plain HTTP is not served.
          ! curl -sf -m 5 http://127.0.0.1:8000/api/health
      - name: Sample PDF
        run: |
          python - <<'PY'
          import pymupdf
          d = pymupdf.open(); p = d.new_page()
          p.insert_text((72, 100), "Ad Soyad: Test Kisi", fontsize=12)
          p.insert_text((72, 130), "Telefon 0532 123 45 67", fontsize=12)
          d.save("sample.pdf")
          PY
      - name: Audit
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          APT_URL=https://localhost:8000 npm run e2e:a11y -- ../sample.pdf
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  launcher:
    name: Windows launcher (csc, C# 5)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile AdminPDFToolkit.exe
        shell: pwsh
        run: |
          $csc = Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64\v4*\csc.exe" | Sort-Object FullName | Select-Object -Last 1
          (Get-Content scripts/launcher/AssemblyInfo.cs.in -Raw).Replace("{version}", "0.0.0") | Set-Content "$env:RUNNER_TEMP\AssemblyInfo.cs"
          # Windows paths: csc reads a forward slash as the start of an option.
          $src = (Resolve-Path scripts\launcher).Path
          & $csc.FullName /nologo /warnaserror /target:winexe "/out:$env:RUNNER_TEMP\AdminPDFToolkit.exe" `
            "/win32icon:$src\app.ico" "/win32manifest:$src\app.manifest" `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll `
            "$src\Launcher.cs" "$env:RUNNER_TEMP\AssemblyInfo.cs"
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
          (Get-Item "$env:RUNNER_TEMP\AdminPDFToolkit.exe").VersionInfo | Format-List ProductName, FileVersion

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: admin-pdf-toolkit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
