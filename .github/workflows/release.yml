name: Release

# Builds both packages, starts each one as a smoke test, and publishes a GitHub
# release v<VERSION> (VERSION from server/adminpdf/config.py) with them when
# either a matching tag is pushed or the workflow is run by hand on main with
# "publish" ticked (the release then creates the tag on that commit).
# On PRs it only builds and tests the packages.
on:
  push:
    tags: ["v*"]
  # Build and smoke-test the packages on PRs that touch packaging.
  pull_request:
    paths: ["scripts/**", ".github/workflows/release.yml", "server/pyproject.toml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish release v<VERSION> from this commit (creates the tag)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    name: Windows package (self-contained)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build package
        env:
          # Newest Tesseract / Ghostscript releases without the anonymous API limit.
          GITHUB_TOKEN: ${{ github.token }}
          # Optional Authenticode signing of AdminPDFToolkit.exe (code-signing
          # certificate as base64 .pfx); unsigned when not set.
          WINDOWS_SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: python scripts/build_windows_portable.py
      - name: Smoke-test the unzipped package (no system Python on PATH)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*-Windows.zip
          Expand-Archive $zip -DestinationPath smoke
          $app = Resolve-Path smoke/AdminPDFToolkit
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $env:APT_DATA_DIR = "$app\data"
          $env:APT_OCR_DIR = "$app\ocr"
          $env:APT_GS_DIR = "$app\gs"
          # Launcher: built, with version info; every component check passes.
          $exe = Get-Item "$app\AdminPDFToolkit.exe"
          $exe.VersionInfo | Format-List ProductName, FileVersion, CompanyName
          if ($exe.VersionInfo.ProductName -ne "Admin PDF Toolkit") { throw "launcher lacks version info" }
          (Get-AuthenticodeSignature $exe.FullName).Status
          $checks = & "$app\python\python.exe" -m adminpdf.selfcheck | ForEach-Object { $_ | ConvertFrom-Json }
          $checks | Where-Object type -eq check | Format-Table id, status, version -AutoSize
          if (-not ($checks | Where-Object type -eq done).ready) { throw "self-check: not ready" }
          foreach ($id in "ocr", "ghostscript") {
            $c = $checks | Where-Object id -eq $id
            if ($c.status -ne "ok") { throw "bundled $id is not ok: $($c | ConvertTo-Json -Compress)" }
          }
          $p = Start-Process -FilePath "$app\python\python.exe" -ArgumentList "-m", "adminpdf" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..60) {
            try { $h = Invoke-RestMethod -SkipCertificateCheck https://127.0.0.1:8000/api/health; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw "server did not start" }
          $h | Format-List
          Invoke-WebRequest -SkipCertificateCheck https://127.0.0.1:8000/ -UseBasicParsing | Out-Null
          $ops = Invoke-RestMethod -SkipCertificateCheck https://127.0.0.1:8000/api/ops
          if (-not (Test-Path "$app\data\tls\ca.crt")) { throw "no local CA was created" }
          # Bundled OCR: present, intact and carrying Turkish.
          $env:TESSDATA_PREFIX = "$app\ocr\tessdata"
          $langs = & "$app\ocr\tesseract.exe" --list-langs 2>&1 | Out-String
          if ($langs -notmatch "(?m)^tur\s*$") { throw "bundled OCR lacks Turkish: $langs" }
          foreach ($bundle in "ocr", "gs") {
            & "$app\python\python.exe" -c "import sys; from pathlib import Path; from adminpdf.core.tools import verify_bundle; bad = verify_bundle(Path(sys.argv[1])); print(sys.argv[1], 'intact' if not bad else bad); sys.exit(1 if bad else 0)" "$app\$bundle"
            if ($LASTEXITCODE -ne 0) { throw "bundled $bundle failed its integrity check" }
          }
          Get-Content "$app\ocr\manifest.json" -Raw | ConvertFrom-Json | Select-Object -ExpandProperty sources | Format-List
          if ($ops.Count -lt 40) { throw "only $($ops.Count) tools loaded" }
          Stop-Process -Id $p.Id -Force
          "$($zip.Name): $([math]::Round($zip.Length / 1MB)) MB, $($ops.Count) tools"
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            dist/*-Windows.zip
            dist/sources/*
          if-no-files-found: error

  python:
    name: Linux / macOS package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build package
        run: python scripts/build_package.py
      - name: Smoke-test the unzipped package
        run: |
          mkdir smoke && cd smoke && unzip -q ../dist/*.zip && cd AdminPDFToolkit/server
          python -m venv .venv && .venv/bin/pip install -q .
          APT_DATA_DIR="$RUNNER_TEMP/apt" nohup .venv/bin/python -m adminpdf > "$RUNNER_TEMP/server.log" 2>&1 &
          CA="$RUNNER_TEMP/apt/tls/ca.crt"
          for i in $(seq 1 30); do curl -sf --cacert "$CA" https://localhost:8000/api/health && break; sleep 1; done
          curl -sf --cacert "$CA" -o /dev/null https://localhost:8000/
          curl -sf --cacert "$CA" -o /dev/null https://localhost:8000/licenses.txt
      - uses: actions/upload-artifact@v5
        with:
          name: python
          path: dist/*-Linux-macOS.zip
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.publish && github.ref == 'refs/heads/main')
    needs: [windows, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Release tag from VERSION
        id: tag
        run: |
          tag="v$(sed -n 's/^VERSION = "\(.*\)"/\1/p' server/adminpdf/config.py)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME != $tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums, signature and manifest
        env:
          # Ed25519 key (scripts/release_signing.py keygen); without it the
          # release is unsigned and the app only announces it.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # Source tarballs (Ghostscript, AGPL-3.0) are published with the binaries.
          if [ -d dist/sources ]; then mv dist/sources/* dist/ && rmdir dist/sources; fi
          unzip -p dist/*-Windows.zip AdminPDFToolkit/package.json > dist/release-manifest.json
          cat dist/release-manifest.json
          pip install -q cryptography
          python3 scripts/release_signing.py sums dist
          python3 scripts/release_signing.py sign dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 scripts/release_notes.py "$TAG" > notes.md
          ls -l dist
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG — Admin PDF Toolkit 2" \
            --notes-file notes.md \
            --latest
