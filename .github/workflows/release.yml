name: Release

# Push a tag like v2.0.0 (matching VERSION in server/adminpdf/config.py) to
# build both packages, start each one as a smoke test, and publish a GitHub
# release with them. On PRs and manual runs it only builds and tests them.
on:
  push:
    tags: ["v*"]
  # Build and smoke-test the packages on PRs that touch packaging.
  pull_request:
    paths: ["scripts/**", ".github/workflows/release.yml", "server/pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows package (self-contained)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build package
        run: python scripts/build_windows_portable.py
      - name: Smoke-test the unzipped package (no system Python on PATH)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*-Windows.zip
          Expand-Archive $zip -DestinationPath smoke
          $app = Resolve-Path smoke/AdminPDFToolkit
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $env:APT_DATA_DIR = "$app\data"
          $p = Start-Process -FilePath "$app\python\python.exe" -ArgumentList "-m", "adminpdf" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..60) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8000/api/health; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw "server did not start" }
          $h | Format-List
          Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing | Out-Null
          $ops = Invoke-RestMethod http://127.0.0.1:8000/api/ops
          if ($ops.Count -lt 40) { throw "only $($ops.Count) tools loaded" }
          Stop-Process -Id $p.Id -Force
          "$($zip.Name): $([math]::Round($zip.Length / 1MB)) MB, $($ops.Count) tools"
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/*-Windows.zip
          if-no-files-found: error

  python:
    name: Linux / macOS package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build package
        run: python scripts/build_package.py
      - name: Smoke-test the unzipped package
        run: |
          mkdir smoke && cd smoke && unzip -q ../dist/*.zip && cd AdminPDFToolkit/server
          python -m venv .venv && .venv/bin/pip install -q .
          APT_DATA_DIR="$RUNNER_TEMP/apt" nohup .venv/bin/python -m adminpdf > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8000/
          curl -sf -o /dev/null http://127.0.0.1:8000/licenses.txt
      - uses: actions/upload-artifact@v5
        with:
          name: python
          path: dist/*-Linux-macOS.zip
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Check tag matches VERSION
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' server/adminpdf/config.py)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME — Admin PDF Toolkit 2" \
            --notes-file notes.md \
            --latest
